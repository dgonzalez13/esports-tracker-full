name: Generate and Deploy Tracker

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run GT
        run: python gtleagues_api.py

      - name: Run Eadriatic
        run: python eadriatic_leagues.py

      - name: Group Analysis GT
        run: python group_analysis.py GT

      - name: Group Analysis Eadriatic
        run: python group_analysis.py EADRIATIC

      - name: Generate Site
        run: python web_tracker/generate_site.py

      - name: Verify generated HTML
        run: |
          test -f docs/index.html
          echo "Generated HTML size:"
          wc -c docs/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4